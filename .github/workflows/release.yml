name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the version and changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dist"
          Scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/dist/NOTES.md"
          printf '\nSource commit %s. Not notarized: see the cask caveats.\n' "$(git rev-parse --short HEAD)" >> "$RUNNER_TEMP/dist/NOTES.md"
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      # The UI tests are run locally before tagging (docs/RELEASING.md).
      - run: swift test --skip PinaxUITests --skip FocusSerial
      - name: Import signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: Scripts/ci-import-cert.sh
      - name: Build
        run: |
          Scripts/build-dist.sh "$VERSION" "$VERSION" "$RUNNER_TEMP/dist"
          Scripts/render-tap.sh "$VERSION" "$RUNNER_TEMP/dist"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIST="$RUNNER_TEMP/dist"
          gh release create "$GITHUB_REF_NAME" --title "Pinax $VERSION" --notes-file "$DIST/NOTES.md" --verify-tag \
            "$DIST/Pinax-$VERSION.zip" "$DIST/pinax-cli-$VERSION.zip" "$DIST/SHA256SUMS"
      - name: Push the Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          DIST="$RUNNER_TEMP/dist"
          KEY="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY" && chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:gitkeniwo/homebrew-pinax.git "$DIST/tap-repo"
          cp -R "$DIST/tap/Casks" "$DIST/tap/Formula" "$DIST/tap/README.md" "$DIST/tap/icon.png" "$DIST/tap-repo/"
          cd "$DIST/tap-repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks Formula README.md icon.png
          git commit -m "pinax $VERSION"
          git push
          rm -f "$KEY"
      - name: Remove the signing keychain
        if: always()
        run: '[ -z "${PINAX_SIGN_KEYCHAIN:-}" ] || security delete-keychain "$PINAX_SIGN_KEYCHAIN"'
